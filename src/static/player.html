<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVARP Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
    }
  }
  </script>
  <style>
    :root {
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --emerald: #10b981;
      --rose: #f43f5e;
      --bg: #0b1120;
      --bg-card: #111827;
      --border: rgba(255,255,255,0.09);
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      flex-wrap: wrap;
    }
    header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
    }
    header .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .status {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .status.online { color: var(--emerald); }
    .status.offline { color: var(--rose); }
    .chip {
      font-size: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--muted);
      background: #1e293b;
      border-radius: 6px;
      padding: 4px 8px;
    }
    a.console-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }
    a.console-link:hover { color: var(--accent-hover); }
    .hint {
      width: 100%;
      font-size: 0.78rem;
      color: var(--muted);
    }
    main {
      display: grid;
      grid-template-columns: minmax(280px, 1.1fr) minmax(280px, 0.9fr);
      min-height: 0;
    }
    .avatar-stage {
      position: relative;
      min-height: 320px;
      background: #1a1a2e;
    }
    #avatar-canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 320px;
    }
    .chat-pane {
      display: grid;
      grid-template-rows: auto 1fr auto;
      border-left: 1px solid var(--border);
      min-height: 0;
    }
    .meters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--muted);
    }
    .meters span { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); }
    #chat-log {
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bubble {
      max-width: 90%;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.4;
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
    }
    .bubble.agent {
      align-self: flex-start;
      background: #1e293b;
    }
    .composer {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--border);
      background: var(--bg-card);
      flex-wrap: wrap;
    }
    #chat-input {
      flex: 1;
      min-width: 140px;
      background: #1a2233;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #send-btn { background: var(--accent); color: #fff; }
    #send-btn:hover { background: var(--accent-hover); }
    #mic-btn { background: #1e293b; color: var(--text); }
    #mic-btn.recording { background: var(--rose); color: #fff; }
    #stop-audio-btn, #mark-btn, #copy-pair-btn { background: transparent; color: var(--muted); }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; grid-template-rows: 42vh 1fr; }
      .chat-pane { border-left: 0; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <h1>OVARP Player</h1>
    <div class="meta">
      <span id="conn-status" class="status offline">Disconnected</span>
      <span id="device-chip" class="chip">web_panel_01</span>
      <span id="agent-chip" class="chip">agent_alpha</span>
      <button id="copy-pair-btn" type="button">Copy pair info</button>
      <a class="console-link" href="/">Back to console</a>
    </div>
    <div class="hint" id="pair-hint">
      VR / WoZ: set Device to this player id so speech and gestures arrive here without Unity.
    </div>
  </header>
  <main>
    <div class="avatar-stage">
      <canvas id="avatar-canvas" aria-label="Agent avatar"></canvas>
    </div>
    <section class="chat-pane">
      <div class="meters" aria-label="Pipeline latency">
        STT <span id="lat-stt">—</span>ms
        · LLM <span id="lat-llm">—</span>ms
        · TTS <span id="lat-tts">—</span>ms
        · total <span id="lat-total">—</span>ms
      </div>
      <div id="chat-log" aria-live="polite"></div>
      <form id="chat-form" class="composer">
        <input id="chat-input" type="text" autocomplete="off" placeholder="Type a message..." aria-label="Message">
        <button id="send-btn" type="submit">Send</button>
        <button id="mic-btn" type="button">Hold to talk</button>
        <button id="mark-btn" type="button">Mark event</button>
        <button id="stop-audio-btn" type="button">Stop audio</button>
      </form>
    </section>
  </main>

  <script type="module">
    import OVARPClient from './sdk/OVARP-client.js';

    const RECONNECT_DELAY_MIN_MS = 2000;
    const RECONNECT_DELAY_MAX_MS = 30000;
    let reconnectDelayMs = RECONNECT_DELAY_MIN_MS;

    const params = new URLSearchParams(window.location.search);
    const deviceId = params.get('device') || 'web_panel_01';
    const agentId = params.get('agent') || 'agent_alpha';

    const chatLog = document.getElementById('chat-log');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const connStatus = document.getElementById('conn-status');
    const micBtn = document.getElementById('mic-btn');
    const stopAudioBtn = document.getElementById('stop-audio-btn');
    const markBtn = document.getElementById('mark-btn');
    const copyPairBtn = document.getElementById('copy-pair-btn');

    document.getElementById('device-chip').textContent = deviceId;
    document.getElementById('agent-chip').textContent = agentId;
    document.getElementById('pair-hint').textContent =
      `In WoZ Control set Device to ${deviceId}. Headset URL: ws://${window.location.host}/ws/client/${deviceId}`;

    function appendChat(role, text) {
      const bubble = document.createElement('div');
      bubble.className = `bubble ${role}`;
      bubble.textContent = text;
      chatLog.appendChild(bubble);
      chatLog.scrollTop = chatLog.scrollHeight;
      return bubble;
    }

    // While a Gemini reply streams in, deltas append to this bubble instead of
    // each spawning a new chat entry. Cleared once the final llm_reply arrives.
    let streamingBubble = null;

    function setStatus(online, label) {
      connStatus.className = `status ${online ? 'online' : 'offline'}`;
      connStatus.textContent = label;
    }

    function setMs(id, value) {
      const el = document.getElementById(id);
      if (!el) return;
      if (value == null || value === '') {
        el.textContent = '—';
        return;
      }
      const n = Number(value);
      el.textContent = Number.isFinite(n) ? String(Math.round(n)) : '—';
    }

    function updateLatency(latency) {
      if (!latency || typeof latency !== 'object') return;
      setMs('lat-stt', latency.stt_ms);
      setMs('lat-llm', latency.llm_ms);
      setMs('lat-tts', latency.tts_ms);
      const total = latency.total_ms != null
        ? latency.total_ms
        : (Number(latency.stt_ms || 0) + Number(latency.llm_ms || 0) + Number(latency.tts_ms || 0));
      setMs('lat-total', total);
    }

    const client = new OVARPClient({
      deviceId,
      agentId,
      canvas: document.getElementById('avatar-canvas'),
      callbacks: {
        onConnect: () => {
          setStatus(true, 'Connected');
          reconnectDelayMs = RECONNECT_DELAY_MIN_MS;
        },
        onDisconnect: () => {
          setStatus(false, 'Reconnecting...');
          setTimeout(() => client.connect(), reconnectDelayMs);
          reconnectDelayMs = Math.min(reconnectDelayMs * 2, RECONNECT_DELAY_MAX_MS);
        },
        onMessage: (sub) => {
          // Text already rendered incrementally via onMessageChunk (Gemini): don't
          // duplicate it, just drop the placeholder. Other providers never chunk,
          // so streamingBubble stays null and the full text is appended here as before.
          if (streamingBubble) {
            streamingBubble = null;
          } else {
            const text = typeof sub === 'string' ? sub : (sub?.text || '');
            if (text) appendChat('agent', text);
          }
          if (sub && typeof sub === 'object' && sub.latency) updateLatency(sub.latency);
        },
        onMessageChunk: (sub) => {
          const delta = sub?.text || '';
          if (!delta) return;
          if (!streamingBubble) streamingBubble = appendChat('agent', '');
          streamingBubble.textContent += delta;
          chatLog.scrollTop = chatLog.scrollHeight;
        },
        onLatency: (lat) => updateLatency(lat),
        onMarkerLogged: (label) => appendChat('agent', `Marker: ${label}`),
        onLog: (msg, type) => {
          if (type === 'error') console.warn('[OVARP Player]', msg);
        }
      }
    });

    client.connect();

    // Load whichever model is installed. Asking for a bundled default is what
    // used to 404 on every fresh clone; with none present the participant sees
    // the chat without an avatar rather than a broken one.
    (async () => {
      try {
        const resp = await fetch('/api/avatars');
        if (!resp.ok) return;
        const [first] = (await resp.json()).avatars || [];
        if (first) await client.loadAvatar(first.url);
      } catch (err) {
        console.warn('[OVARP Player] Avatar load failed', err);
      }
    })();

    chatForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;
      appendChat('user', text);
      client.sendText(text);
      chatInput.value = '';
    });

    const startMic = async () => {
      micBtn.classList.add('recording');
      micBtn.textContent = 'Listening...';
      await client.startMic();
    };
    const stopMic = () => {
      micBtn.classList.remove('recording');
      micBtn.textContent = 'Hold to talk';
      client.stopMic();
    };

    micBtn.addEventListener('mousedown', startMic);
    micBtn.addEventListener('mouseup', stopMic);
    micBtn.addEventListener('mouseleave', () => {
      if (micBtn.classList.contains('recording')) stopMic();
    });
    micBtn.addEventListener('touchstart', (event) => {
      event.preventDefault();
      startMic();
    });
    micBtn.addEventListener('touchend', (event) => {
      event.preventDefault();
      stopMic();
    });

    markBtn.addEventListener('click', () => {
      const label = window.prompt('Marker label', 'player_event') || '';
      const trimmed = label.trim();
      if (!trimmed) return;
      client.addMarker(trimmed, { source: 'player', device: deviceId });
    });

    copyPairBtn.addEventListener('click', async () => {
      const info = `device=${deviceId}\nws://` + window.location.host + `/ws/client/${deviceId}`;
      try {
        await navigator.clipboard.writeText(info);
        copyPairBtn.textContent = 'Copied';
        setTimeout(() => { copyPairBtn.textContent = 'Copy pair info'; }, 1200);
      } catch (err) {
        console.warn('[OVARP Player] clipboard', err);
      }
    });

    stopAudioBtn.addEventListener('click', () => {
      const player = document.getElementById('OVARP-tts-audio-player');
      if (player) {
        player.pause();
        player.currentTime = 0;
      }
    });
  </script>
</body>
</html>
